  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

              const { done, value } = await reader.read();

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

) auto;gap:16px;align-items:start;border-top:1px solid var(--color-divider);padding-top:12px\">\n                      <div>\n                        <div style=\"font-family:var(--font-heading);font-size:18px;margin-bottom:3px\">{{ c.name }}<\u002Fdiv>\n                        <p style=\"font-size:14px;line-height:1.6;margin:0;max-width:80ch;color:var(--color-neutral-700);text-wrap:pretty\">{{ c.desc }}<\u002Fp>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ showGrades }}\">\n                        <span style=\"font-family:var(--font-heading);font-size:14px;letter-spacing:0.06em;padding:3px 9px;background:var(--color-accent-100);color:var(--color-accent-800);white-space:nowrap\">{{ c.grade }}<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ d.toggle }}\" style=\"cursor:pointer;font-family:var(--font-heading);font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-700);background:transparent;border:0;padding:0\" style-hover=\"color:var(--color-accent)\">{{ d.toggleLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"hackathons\" style=\"padding:84px 0 0\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--color-divider);padding-bottom:12px;margin-bottom:26px\">\n        <span style=\"font-family:var(--font-heading);font-size:13px;letter-spacing:0.14em;color:var(--color-accent-700)\">07<\u002Fspan>\n        <h2 style=\"margin:0;font-size:34px\">{{ t.hack.title }}<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:26px\">\n        <sc-for list=\"{{ hackathons }}\" as=\"h\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr);gap:32px;border-top:1px solid var(--color-divider);padding-top:22px\">\n            <div>\n              <div style=\"font-family:var(--font-heading);font-size:19px\">{{ h.year }}<\u002Fdiv>\n              <div style=\"font-size:12px;letter-spacing:0.09em;text-transform:uppercase;color:var(--color-neutral-600)\">{{ h.place }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <h3 style=\"margin:0 0 10px;font-size:24px\">{{ h.title }}<\u002Fh3>\n              <p style=\"font-size:16px;line-height:1.7;max-width:78ch;margin:0 0 12px;text-wrap:pretty\">{{ h.summary }}<\u002Fp>\n              <sc-if value=\"{{ h.isOpen }}\">\n                <p style=\"font-size:15px;line-height:1.7;max-width:80ch;margin:0 0 12px;color:var(--color-neutral-800);text-wrap:pretty\">{{ h.detail }}<\u002Fp>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ h.toggle }}\" style=\"cursor:pointer;font-family:var(--font-heading);font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-700);background:transparent;border:0;padding:0\" style-hover=\"color:var(--color-accent)\">{{ h.toggleLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"contact\" style=\"padding:84px 0 0\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--color-divider);padding-bottom:12px;margin-bottom:26px\">\n        <span style=\"font-family:var(--font-heading);font-size:13px;letter-spacing:0.14em;color:var(--color-accent-700)\">08<\u002Fspan>\n        <h2 style=\"margin:0;font-size:34px\">{{ t.contact.title }}<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start\">\n        <div>\n          <p style=\"font-size:19px;line-height:1.6;max-width:44ch;margin:0 0 20px;text-wrap:pretty\">{{ t.contact.line }}<\u002Fp>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <a class=\"btn btn-primary\" href=\"mailto:riccardo.zucchelli@gmail.com\" style=\"font-size:14px;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none\">{{ t.contact.mail }}<\u002Fa>\n            <a class=\"btn btn-secondary\" href=\"assets/Riccardo_Zucchelli_CV_EN.pdf\" download=\"\" style=\"font-size:14px;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;color:var(--color-text)\">{{ t.cvLabel }}<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:12px\">\n          <sc-for list=\"{{ contacts }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:82px 1fr;gap:12px;align-items:baseline;border-top:1px solid var(--color-divider);padding-top:11px\">\n              <span style=\"font-family:var(--font-heading);font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600)\">{{ c.label }}<\u002Fspan>\n              <a href=\"{{ c.href }}\" style=\"font-size:15px;word-break:break-word\">{{ c.value }}<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:64px;border-top:1px solid var(--color-divider);padding-top:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px\">\n        <span style=\"font-size:12px;color:var(--color-neutral-600)\">Riccardo Zucchelli<\u002Fspan>\n        <span style=\"font-size:12px;color:var(--color-neutral-600)\">{{ t.gdpr }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;it&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en' | 'it'&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showCourseGrades&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#5980a6&quot;,&quot;#1d2d3d&quot;,&quot;#6f7f5a&quot;,&quot;#8a6a52&quot;],&quot;default&quot;:&quot;#5980a6&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;}}\">\nclass Component extends DCLogic {\n  state = { lang: null, filter: 'all', open: {} };\n\n  D = {\n    en: {\n      cvLabel: 'CV (PDF)',\n      gdpr: 'I authorise the processing of my personal data pursuant to Art. 13 GDPR (EU 2016/679).',\n      nav: [['#skills','Skills'],['#research','Research'],['#projects','Projects'],['#experience','Experience'],['#powsup','Compliance'],['#education','Education'],['#hackathons','Hackathons'],['#contact','Contact']],\n      hero: {\n        kicker: 'Network & Infrastructure Security',\n        contactTitle: 'Contact',\n        summary: 'Recent Computer Science graduate, specialising in security and networking, with practical experience in building and maintaining highly secure IT systems including personal infrastructure. Currently researching programmable P4 switching, combining routing and machine learning.',\n        second: 'Day to day that means firewalling and network hardening, Proxmox and Linux server administration, monitoring and disaster recovery — on medical infrastructure, on IoT deployments, and on infrastructure I run myself.'\n      },\n      langs: [{ level: 'C1', name: 'English' }, { level: 'Native', name: 'Italian' }],\n      skills: { title: 'Technical skills', hint: 'Filter by domain' },\n      filters: [['all','All'],['security','Security'],['networking','Networking'],['infra','Infrastructure'],['sysadmin','SysAdmin'],['embedded','IoT & embedded'],['ml','AI / ML'],['compliance','Compliance']],\n      skillGroups: [\n        { d: ['security','networking'], title: 'Network security', tagline: 'Attack, defence, hardening', items: ['Network security & firewalling','iptables','IDS / IPS','Proxies & reverse proxies','Enterprise network hardening','Pentesting','SSL / TLS','IPSec','SSH','ACLs for sensitive data','CrowdSec','Tailscale segmentation'] },\n        { d: ['networking'], title: 'Programmable networking', tagline: 'Data, control and management plane', items: ['P4 programmable switches','BMv2','TNA / Intel Tofino','SDN & OpenFlow','POX controller','Segment Routing','NETCONF / YANG','DNS','Load balancing'] },\n        { d: ['security'], title: 'Security analysis', tagline: 'Malware, crypto, secure computation', items: ['Malware analysis','Reverse engineering','Static & dynamic analysis','x86 assembly','Packing & C2 analysis','Code injection','Symmetric & asymmetric crypto','Secure multi-party computation','Zero-knowledge proofs','Garbled circuits','Post-quantum security','MP-SPDZ'] },\n        { d: ['infra','sysadmin'], title: 'Virtualisation & infrastructure', tagline: 'Hypervisors and containers', items: ['Proxmox VE','QEMU','VMware','VirtualBox','VM & container management','Docker','Portainer','Linux server administration (Debian, Ubuntu)','Nginx + TLS'] },\n        { d: ['sysadmin','infra'], title: 'System administration', tagline: 'Keeping critical systems up', items: ['Monitoring (Grafana)','Backups & disaster recovery','Troubleshooting & maintenance','Self-hosted services','Vendor & partner coordination','Technical documentation','bash / zsh','git, GitHub, GitLab'] },\n        { d: ['embedded'], title: 'IoT & embedded', tagline: 'Low level, resource constrained', items: ['Node-RED orchestration','Berry','C hardware interfacing','MQTT','Sensor emulation','Synthetic dataset generation','Integration & functional testing','Arduino registers'] },\n        { d: ['ml'], title: 'AI & machine learning', tagline: 'Applied to networking and vision', items: ['PyTorch','Pandas','Supervised & unsupervised learning','Reinforcement learning','CNNs','Computer vision (SIFT, Sobel, LoG)','YOLO with SAHI slicing','In-network inference'] },\n        { d: ['ml','embedded','security'], title: 'Languages', tagline: 'Programming and description', items: ['Python','C / C++','Bash','Java','P4','Berry','x86 Assembly','Kotlin','PL/pgSQL','CMake'] },\n        { d: ['compliance'], title: 'Governance & compliance', tagline: 'Non-profit finance and data protection', items: ['RUNTS obligations','APS legislation','Financial statements','Bookkeeping','GDPR record of processing','Privacy policies','DPIA','Risk assessment','Statutory reporting'] }\n      ],\n      research: { title: 'Research' },\n      researchItems: [\n        { kicker: \"Master's thesis — in progress\", period: '2024 — 2026', title: 'Intelligent Packets: machine-learning-driven forwarding on P4',\n          summary: 'Internet routers still forward packets essentially the way they did at the start of the Internet: look at the destination address, consult a table, send it on. My thesis asks what happens if that decision is made by a small inference model running inside the switch instead, at line rate, with each packet carrying the information needed to query metadata held on the router.',\n          detail: ['The approach, called Intelligent Packets (IPA), replaces destination-address lookup with in-line inference. Rather than routing towards an IP address, each packet queries ad-hoc metadata on the routers it traverses and the forwarding path is determined dynamically. The goal is to match or beat conventional routing in realistic scenarios while enabling forwarding decisions that static routing tables cannot express.',\n            'To show that in-network inference at line rate is feasible, IPA is implemented in P4 on BMv2, the reference software switch of the P4 project, written within the constraints of a TNA-compliant program so it can be ported to the Intel Tofino ASIC — hardware that runs custom processing logic at terabit speeds.',\n            'The system is evaluated against standard Internet routing under realistic network conditions on the GÉANT topology, with the results intended for publication.'],\n          tags: ['P4','BMv2','TNA / Tofino','GÉANT topology','In-network ML'] },\n        { kicker: \"Bachelor's thesis\", period: '2021 — 2024', title: 'Building segmentation from multispectral satellite imagery',\n          summary: 'A hybrid computer-vision and deep-learning pipeline for segmenting buildings in multispectral satellite images from the SpaceNet 6 dataset.',\n          detail: ['Classical vision operators — Laplacian of Gaussian and Sobel for edge detection, SIFT for feature detection — were used to produce refined inputs for a convolutional neural network, giving a hybrid model with high F1 scores.'],\n          tags: ['SpaceNet 6','CNN','SIFT','Sobel / LoG'] }\n      ],\n      projects: { title: 'Projects' },\n      projectItems: [\n        { kicker: 'Infrastructure — ongoing', title: 'Secure self-hosted infrastructure',\n          summary: 'A production-grade home datacentre: Proxmox VE virtualisation with Portainer orchestration, Nginx as reverse proxy with TLS management, and a segmented network where internal-only services are reachable only over a Tailscale VPN.',\n          bullets: ['Network segmentation via Tailscale VPN for internal-only services; public-facing endpoints hardened separately.','Grafana for monitoring; CrowdSec for detecting and blocking threats.','Hosted workloads include Home Assistant for home automation and Immich for photo management.','Backup and recovery planning designed and tested against real failure scenarios.'],\n          tags: ['Proxmox','Nginx','Tailscale','Grafana','CrowdSec'] },\n        { kicker: 'SDN', title: 'SDN load-balancing controller',\n          summary: 'A load-balancing controller written in POX that distributes new flows transparently across backend servers.',\n          bullets: ['Connection-tracking-based session affinity keeps established flows pinned to their backend.','Capacity-weighted least-load algorithm selects the backend for each new flow.','Distribution is transparent to clients — no change on the endpoint side.'],\n          tags: ['POX','OpenFlow','Load balancing'] },\n        { kicker: 'Programmable networks', title: 'Tunnel-based forwarding & proof of transit in P4',\n          summary: 'A P4 pipeline that forwards packets on a custom tunnel identifier instead of the destination IP, and proves at the egress which path each packet actually took.',\n          bullets: ['The ingress switch classifies packets on IPv4 source, destination and DSCP, chooses a tunnel ID, pushes a custom tunnel header and initialises the validation stack.','Transit switches forward on the tunnel ID and each append a validation header carrying a hop-specific configurable value.','The egress switch processes the stack, sums the values and accepts or drops the packet against a per-tunnel threshold.','Validated on a multi-switch emulated topology with six configured tunnel paths.'],\n          tags: ['P4','Custom headers','Path validation','Tunnelling'] },\n        { kicker: 'Embedded', title: 'Arduino-based oscilloscope',\n          summary: 'A working oscilloscope built on the analogue pins of an Arduino Mega, driven from a Linux host.',\n          bullets: ['Low-level register programming against native Arduino libraries.','Companion C program on Linux for acquisition and display.','Built as part of a low-level Linux kernel course (30/30 with distinction).'],\n          tags: ['C','Arduino','Registers'] }\n      ],\n      experience: { title: 'Experience' },\n      experienceItems: [\n        { period: '2024 — 2026', place: 'Rome', role: 'Junior Consultant', org: 'Solvis S.r.l.',\n          summary: 'Solvis has worked in IoT and building automation since 2015, developing, building and maintaining both software and hardware. I build embedded infrastructure programmed in Berry and C and orchestrated through Node-RED, implementing and emulating low-level logic and sensors.',\n          bullets: ['Designed and developed Node-RED flows orchestrating communication between IoT devices and supervisory systems.','Wrote Berry scripts implementing control logic on embedded devices.','Programmed low-level C modules interfacing with peripheral hardware.','Emulated sensors and generated synthetic datasets to support functional and integration testing.','Analysed and diagnosed anomalies in communication flows between IoT network nodes, identifying and resolving root causes.','Defined test scenarios verifying correct operation of the developed infrastructure.','Wrote technical documentation covering the architecture, configurations adopted and test results.','Worked with the development team to integrate software modules into the client\\u2019s overall infrastructure.','Deployed and maintained systems on Linux (Debian/Ubuntu), including resource-constrained environments.','Implemented an MQTT stack architecture, used with Node-RED for orchestration and device emulation.'] },\n        { period: '2022 — 2024', place: 'Rome', role: 'IT Manager', org: 'Studio Medico Bastianelli',\n          summary: 'Responsible for the IT infrastructure supporting the practice\\u2019s clinical and administrative work, guaranteeing continuity of the critical systems that handle patient health data. I was also the main point of contact for external suppliers and technology partners, coordinating maintenance and upgrade work.',\n          bullets: ['Managed and maintained critical IT/medical infrastructure, with particular attention to the operational continuity of high-risk medical systems.','Defined and managed network security and firewalling policies protecting the sensitive data processed.','Applied ACLs to control access to critical medical data.','Planned and ran monitoring, backup and disaster recovery.','Ordinary and extraordinary systems troubleshooting and maintenance.','Managed relationships with external suppliers of medical equipment and healthcare platforms.'] }\n      ],\n      powsup: {\n        title: 'Association leadership & compliance',\n        kicker: 'Non-profit governance',\n        role: 'Team Leader — Accounting & Compliance',\n        org: 'PowsUp! APS · Administrator',\n        lead: 'PowsUp! APS is a non-profit association registered with RUNTS, the Italian national register of third-sector entities. As an administrator of the association I lead the Accounting & Compliance team, which owns its finances and every legal obligation that follows from that registration.',\n        lead2: 'I have handled this side of the association from its founding: I taught myself the legislation behind running an APS and built the function from nothing — outside my own field, and now a working governance practice.',\n        facts: [\n          { label: 'Role', value: 'Administrator; Team Leader, Accounting & Compliance' },\n          { label: 'Scope', value: 'Finance, RUNTS obligations, GDPR documentation' },\n          { label: 'Registration', value: 'RUNTS — Italian national register of third-sector entities' },\n          { label: 'How', value: 'Legislation learned independently, from the association\\u2019s founding onwards' }\n        ]\n      },\n      powsupBlocks: [\n        { kicker: 'Finance', title: 'Accounting', items: ['Annual financial statements and the accompanying reports required of an APS.','Ongoing bookkeeping, treasury and membership fee handling.','Budget planning and expenditure tracking across the association\\u2019s activities.','Preparing the figures the board and the members\\u2019 assembly vote on.'] },\n        { kicker: 'Legal', title: 'RUNTS & statutory obligations', items: ['Registration with RUNTS and the filings the register requires.','Tracking and meeting statutory deadlines and reporting obligations.','Keeping the statute, governance records and membership registry in order.','Interpreting third-sector legislation as it applies to the association\\u2019s activities.'] },\n        { kicker: 'Data protection', title: 'GDPR programme', items: ['Record of processing activities for the association\\u2019s data.','Privacy policies and information notices for members and participants.','Data Protection Impact Assessment (DPIA).','Risk assessment — the part of this work that sits closest to my security background.'] }\n      ],\n      education: { title: 'Education' },\n      educationItems: [\n        { period: '2024 — 2026', status: 'In progress — expected with honours', title: \"Master's in Software Engineering\", org: 'Sapienza University of Rome',\n          note: 'Specialisation in security and networking. Thesis on machine-learning-driven packet forwarding implemented in P4 (see Research).',\n          courses: [\n            { name: 'Practical Network Defense', grade: '30/30 cum laude', desc: 'Hands-on attack and defence: configuring and hardening a corporate network with IDS/IPS, pentesting, proxies and firewalls. A deep dive on the material covered in Cybersecurity.' },\n            { name: 'Cybersecurity', grade: '30/30', desc: 'Two modules. Symmetric and asymmetric cryptography, cryptographic hashing, access control, web certificates and authentication; practically, SSL/TLS and security protocols including IPSec, SSH and iptables. The second module covered mail and web security, common attacks and defences against them.' },\n            { name: 'Secure Computation', grade: '30/30', desc: 'Multi-party and distributed computation, post-quantum security, garbled circuits and zero-knowledge proofs, with emphasis on composing protocols from primitives already proven secure (oblivious transfer, coin flipping). Homomorphic encryption covered in outline. MP-SPDZ used as the MPC framework.' },\n            { name: 'Programmable Networks', grade: '30/30', desc: 'State of the art across the stack: management plane automation via NETCONF and YANG, control plane via SDN, OpenFlow and Segment Routing, data plane via software-defined switches and P4 as a programming domain for specific ASICs. One of the foundations of my thesis work.' },\n            { name: 'Malware Analysis', grade: '29/30', desc: 'Software analysis applied to packing, C2 servers and reverse engineering across static and dynamic analysis, crypto and code injection, with a deep dive into assembly, tested on real malware — including a partial analysis of the ransomware that hit Sapienza\\u2019s systems in February 2026.' }\n          ] },\n        { period: '2021 — 2024', status: 'Graduated with honours', title: \"Bachelor's in Computer Science Engineering\", org: 'Sapienza University of Rome',\n          note: 'Thesis on building segmentation from multispectral satellite imagery (see Research).',\n          courses: [\n            { name: 'Operating Systems', grade: '30/30 cum laude', desc: 'Low-level Linux kernel study and application. Built an oscilloscope using the analogue pins of an Arduino Mega via native libraries and registers, with a companion C program on Linux.' },\n            { name: 'Computing Systems 2', grade: '30/30 cum laude', desc: 'Synchronisation and concurrency between processes (critical sections, mutual exclusion, semaphores, monitors, compare-and-swap, busy waiting and starvation), process and thread management at OS level (PCB, user- and kernel-level thread models), and IPC (POSIX shared memory, pipes). Introduced networking fundamentals and distributed systems models.' },\n            { name: 'Computer Networks', grade: '28/30', desc: 'Network and systems programming in C: concurrent TCP/UDP socket servers written from scratch (fork, select, I/O multiplexing) and IPC via pipes/FIFOs, shared memory, semaphores and POSIX threads with mutexes.' }\n          ] }\n      ],\n      hack: { title: 'Hackathons & programmes' },\n      hackItems: [\n        { year: '2026', place: 'Rome', title: 'SPACEHACK Leonardo Hackathon — Space Edition',\n          summary: 'A six-person multidisciplinary team (computer, aerospace, aeronautical, electronic and mechanical engineering) at the Leonardo Space Edition hackathon, organised by Leonardo with Talent Garden, Telespazio and e-GEOS. We designed a satellite constellation for near-real-time Earth-observation intelligence.',\n          detail: 'Two-tier architecture: \"Observer\" satellites in low orbit (400 km) carrying edge AI for anomaly detection (YOLO models with SAHI slicing), and \"Master\" satellites at 1200 km for storage, data relay and over-the-air model distribution. The design covered optical inter-satellite links and Ka/X-band links to ground with the corresponding link budget, a ground segment with stations in Antarctica and Svalbard, and a PaaS user interface with queries and dashboards for consuming alerts. It also included a full business plan with cost estimates — total investment estimated at €1.1 billion.' },\n        { year: '2025', place: 'EPFL, Lausanne', title: 'SUI x BSA Hackathon — Walrus Vault',\n          summary: 'An international team (TUM Blockchain Club, Sapienza, Tor Vergata) at the Sui x BSA Hackathon 2025, organised by EPFL\\u2019s Blockchain Student Association with the Sui Foundation.',\n          detail: 'We built Walrus Vault, a decentralised platform for anonymous document sharing (whistleblowing) on the Sui blockchain with Walrus distributed storage: privacy-preserving authentication via zkLogin, Sui Move smart contracts for metadata management, and an AI analysis module (via OpenRouter) for categorising uploaded content and surfacing insight. Stack: React/Vite frontend, Express.js backend, Python agents for AI processing.' },\n        { year: '2026', place: 'Hong Kong', title: 'PolyU International Research Summer School',\n          summary: 'A two-week programme run by the Graduate School of Hong Kong Polytechnic University for undergraduate and master\\u2019s students selected on merit.',\n          detail: 'Laboratory work, research workshops and direct discussion with faculty, aimed at students considering a doctorate.' }\n      ],\n      contact: { title: 'Contact', line: 'Open to roles in security, networking and infrastructure. Based in Rome.', mail: 'Send an email' },\n      expand: 'Read more', collapse: 'Close'\n    },\n    it: {\n      cvLabel: 'CV (PDF)',\n      gdpr: 'Autorizzo il trattamento dei miei dati personali ai sensi dell\\u2019art. 13 GDPR (Regolamento UE 2016/679).',\n      nav: [['#skills','Competenze'],['#research','Ricerca'],['#projects','Progetti'],['#experience','Esperienza'],['#powsup','Compliance'],['#education','Formazione'],['#hackathons','Hackathon'],['#contact','Contatti']],\n      hero: {\n        kicker: 'Sicurezza di rete e infrastrutture',\n        contactTitle: 'Contatti',\n        summary: 'Ingegnere informatico specializzato in sicurezza e networking, con esperienza pratica nella costruzione e nella manutenzione di sistemi IT ad alta sicurezza, inclusa infrastruttura personale. Attualmente svolgo ricerca su switching programmabile in P4, unendo instradamento e machine learning.',\n        second: 'Nel concreto significa firewalling e hardening di rete, amministrazione di server Linux e Proxmox, monitoring e disaster recovery — su infrastruttura medicale, su installazioni IoT e sull\\u2019infrastruttura che gestisco personalmente.'\n      },\n      langs: [{ level: 'C1', name: 'Inglese' }, { level: 'Madrelingua', name: 'Italiano' }],\n      skills: { title: 'Competenze tecniche', hint: 'Filtra per ambito' },\n      filters: [['all','Tutte'],['security','Sicurezza'],['networking','Networking'],['infra','Infrastruttura'],['sysadmin','Sistemistica'],['embedded','IoT ed embedded'],['ml','AI / ML'],['compliance','Compliance']],\n      skillGroups: [\n        { d: ['security','networking'], title: 'Sicurezza di rete', tagline: 'Attacco, difesa, hardening', items: ['Sicurezza di rete e firewalling','iptables','IDS / IPS','Proxy e reverse proxy','Hardening di rete aziendale','Pentesting','SSL / TLS','IPSec','SSH','ACL su dati sensibili','CrowdSec','Segmentazione Tailscale'] },\n        { d: ['networking'], title: 'Reti programmabili', tagline: 'Data, control e management plane', items: ['Switch programmabili P4','BMv2','TNA / Intel Tofino','SDN e OpenFlow','Controller POX','Segment Routing','NETCONF / YANG','DNS','Load balancing'] },\n        { d: ['security'], title: 'Analisi di sicurezza', tagline: 'Malware, crittografia, secure computation', items: ['Malware analysis','Reverse engineering','Analisi statica e dinamica','Assembly x86','Packing e analisi C2','Code injection','Crittografia simmetrica e asimmetrica','Secure multi-party computation','Zero-knowledge proof','Garbled circuits','Sicurezza post-quantistica','MP-SPDZ'] },\n        { d: ['infra','sysadmin'], title: 'Virtualizzazione e infrastruttura', tagline: 'Hypervisor e container', items: ['Proxmox VE','QEMU','VMware','VirtualBox','Gestione VM e container','Docker','Portainer','Amministrazione server Linux (Debian, Ubuntu)','Nginx + TLS'] },\n        { d: ['sysadmin','infra'], title: 'Sistemistica', tagline: 'Continuità dei sistemi critici', items: ['Monitoring (Grafana)','Backup e disaster recovery','Troubleshooting e manutenzione','Servizi self-hosted','Rapporti con fornitori e partner','Documentazione tecnica','bash / zsh','git, GitHub, GitLab'] },\n        { d: ['embedded'], title: 'IoT ed embedded', tagline: 'Basso livello, risorse limitate', items: ['Orchestrazione Node-RED','Berry','Interfacciamento hardware in C','MQTT','Emulazione di sensori','Generazione di dataset sintetici','Test di integrazione e funzionali','Registri Arduino'] },\n        { d: ['ml'], title: 'AI e machine learning', tagline: 'Applicati a rete e visione', items: ['PyTorch','Pandas','Apprendimento supervisionato e non supervisionato','Reinforcement learning','Reti convoluzionali','Computer vision (SIFT, Sobel, LoG)','YOLO con slicing SAHI','Inferenza in-network'] },\n        { d: ['ml','embedded','security'], title: 'Linguaggi', tagline: 'Programmazione e descrizione', items: ['Python','C / C++','Bash','Java','P4','Berry','Assembly x86','Kotlin','PL/pgSQL','CMake'] },\n        { d: ['compliance'], title: 'Governance e compliance', tagline: 'Contabilità no profit e protezione dei dati', items: ['Obblighi RUNTS','Legislazione APS','Bilancio d\\u2019esercizio','Contabilità','Registro dei trattamenti','Privacy policy','DPIA','Risk assessment','Adempimenti e rendicontazione'] }\n      ],\n      research: { title: 'Ricerca' },\n      researchItems: [\n        { kicker: 'Tesi magistrale — in corso', period: '2024 — 2026', title: 'Intelligent Packets: instradamento guidato dal machine learning su P4',\n          summary: 'I router instradano i pacchetti come agli albori di Internet: si guarda l\\u2019indirizzo di destinazione, si consulta una tabella, si inoltra. La mia tesi chiede cosa accade se quella decisione la prende invece un modello di inferenza che gira dentro allo switch, a line rate, con ogni pacchetto che porta con sé le informazioni per interrogare i metadati presenti sul router.',\n          detail: ['L\\u2019approccio, denominato Intelligent Packets (IPA), sostituisce la ricerca sull\\u2019indirizzo di destinazione con un\\u2019inferenza eseguita in linea. Anziché instradare verso un indirizzo IP, ogni pacchetto interroga metadati ad-hoc sui router che attraversa e il percorso di inoltro viene determinato dinamicamente. L\\u2019obiettivo è eguagliare o superare l\\u2019instradamento convenzionale in scenari realistici, abilitando al contempo decisioni che le tabelle di routing statiche non sono in grado di esprimere.',\n            'Per validare la fattibilità dell\\u2019inferenza in rete a line rate, IPA è implementato in P4 sulla piattaforma BMv2, lo switch software di riferimento del progetto P4, seguendo i vincoli di un programma conforme allo standard TNA in vista di un possibile porting sull\\u2019ASIC Intel Tofino, piattaforma in grado di eseguire logiche personalizzate a velocità dell\\u2019ordine del terabit.',\n            'Il sistema viene valutato a confronto con gli standard di instradamento Internet in condizioni di rete realistiche sulla topologia GÉANT, con l\\u2019obiettivo di pubblicare i risultati in un paper scientifico.'],\n          tags: ['P4','BMv2','TNA / Tofino','Topologia GÉANT','ML in rete'] },\n        { kicker: 'Tesi triennale', period: '2021 — 2024', title: 'Segmentazione di edifici da immagini satellitari multispettrali',\n          summary: 'Una pipeline ibrida di computer vision e deep learning per la segmentazione di edifici su immagini satellitari multispettrali del dataset SpaceNet 6.',\n          detail: ['Operatori classici di visione — LoG e operatori di Sobel per l\\u2019edge detection, SIFT per la feature detection — sono stati usati per fornire dati raffinati a una rete neurale convoluzionale, ottenendo un modello ibrido con valori di F1-score elevati.'],\n          tags: ['SpaceNet 6','CNN','SIFT','Sobel / LoG'] }\n      ],\n      projects: { title: 'Progetti' },\n      projectItems: [\n        { kicker: 'Infrastruttura — in corso', title: 'Infrastruttura self-hosted sicura',\n          summary: 'Un piccolo datacenter domestico gestito come un ambiente di produzione: virtualizzazione Proxmox VE con orchestrazione Portainer, Nginx come reverse proxy con gestione TLS e una rete segmentata in cui i servizi interni sono raggiungibili solo tramite VPN Tailscale.',\n          bullets: ['Segmentazione di rete tramite VPN Tailscale per i servizi interni; endpoint pubblici hardenizzati separatamente.','Grafana per il monitoring, CrowdSec per il rilevamento e il blocco delle minacce.','Tra i servizi ospitati: Home Assistant per la domotica e Immich per la gestione delle fotografie.','Pianificazione di backup e recovery, verificata su scenari di guasto reali.'],\n          tags: ['Proxmox','Nginx','Tailscale','Grafana','CrowdSec'] },\n        { kicker: 'SDN', title: 'Controller SDN di load balancing',\n          summary: 'Un controller di load balancing scritto in POX che distribuisce i nuovi flussi in modo trasparente tra i server di backend.',\n          bullets: ['Session affinity basata su connection tracking: i flussi già stabiliti restano legati al proprio backend.','Algoritmo least-load pesato sulla capacità per la scelta del backend di ogni nuovo flusso.','Distribuzione trasparente per i client, senza modifiche lato endpoint.'],\n          tags: ['POX','OpenFlow','Load balancing'] },\n        { kicker: 'Reti programmabili', title: 'Tunnel-based forwarding e proof of transit in P4',\n          summary: 'Una pipeline P4 che instrada i pacchetti in base a un identificatore di tunnel personalizzato anziché all\\u2019indirizzo IP di destinazione, e verifica in egress quale percorso il pacchetto ha effettivamente attraversato.',\n          bullets: ['Lo switch di ingresso classifica i pacchetti su IPv4 sorgente, destinazione e DSCP, sceglie il tunnel ID, inserisce un header di tunnel personalizzato e inizializza lo stack di validazione.','Gli switch di transito instradano sul tunnel ID e ciascuno appende un header di validazione con un valore configurabile specifico dell\\u2019hop.','Lo switch di egresso elabora lo stack, somma i valori e accetta o scarta il pacchetto in base a una soglia per tunnel.','Validato su una topologia emulata multi-switch con sei percorsi di tunnel configurati.'],\n          tags: ['P4','Header personalizzati','Validazione di percorso','Tunneling'] },\n        { kicker: 'Embedded', title: 'Oscilloscopio su Arduino',\n          summary: 'Un oscilloscopio funzionante costruito sui pin analogici di un Arduino Mega, pilotato da un host Linux.',\n          bullets: ['Programmazione a basso livello dei registri, con le librerie native Arduino.','Programma C su Linux per acquisizione e visualizzazione.','Realizzato nell\\u2019ambito dell\\u2019esame di Sistemi Operativi (30 e lode).'],\n          tags: ['C','Arduino','Registri'] }\n      ],\n      experience: { title: 'Esperienza' },\n      experienceItems: [\n        { period: '2024 — 2026', place: 'Roma', role: 'Junior Consultant', org: 'Solvis S.r.l.',\n          summary: 'Solvis S.r.l. dal 2015 opera nell\\u2019ambito di sistemi IoT e di building automation, occupandosi di sviluppo, costruzione e manutenzione sia di software che di hardware. Nel mio ruolo mi occupo dello sviluppo di infrastrutture embedded programmate in Berry e in C ed orchestrate attraverso Node-RED per l\\u2019implementazione ed emulazione di logiche a basso livello e di sensori.',\n          bullets: ['Progettazione e sviluppo di flussi Node-RED per l\\u2019orchestrazione della comunicazione tra dispositivi IoT e sistemi di supervisione.','Sviluppo di script in linguaggio Berry per l\\u2019implementazione di logiche di controllo su dispositivi embedded.','Programmazione in linguaggio C di moduli di interfacciamento a basso livello con l\\u2019hardware periferico.','Emulazione di sensori e generazione di dataset sintetici a supporto delle attività di test funzionale e di integrazione.','Analisi e diagnosi di anomalie nei flussi di comunicazione tra i nodi della rete IoT, con individuazione e risoluzione delle cause radice.','Definizione di scenari di test per la verifica del corretto funzionamento dell\\u2019infrastruttura sviluppata.','Redazione di documentazione tecnica relativa all\\u2019architettura sviluppata, alle configurazioni adottate e agli esiti delle attività di test.','Collaborazione con il team di sviluppo per l\\u2019integrazione dei moduli software nell\\u2019infrastruttura complessiva del cliente.','Utilizzo di ambienti Linux (Debian/Ubuntu), anche resource-constrained, per il deployment e la manutenzione dei sistemi sviluppati.','Implementazione di un\\u2019architettura a stack MQTT, utilizzata con Node-RED per orchestrazione ed emulazione dei dispositivi.'] },\n        { period: '2022 — 2024', place: 'Roma', role: 'IT Manager', org: 'Studio Medico Bastianelli',\n          summary: 'Responsabile della gestione e manutenzione dell\\u2019infrastruttura informatica a supporto delle attività cliniche e amministrative dello studio, garantendo la continuità operativa dei sistemi critici per la gestione dei dati sanitari. Il ruolo ha previsto inoltre la funzione di principale referente per i rapporti con fornitori e partner tecnologici esterni, coordinando gli interventi di manutenzione e aggiornamento dell\\u2019infrastruttura.',\n          bullets: ['Gestione e manutenzione dell\\u2019infrastruttura IT/medicale critica, con particolare attenzione alla continuità operativa dei sistemi medici ad alto rischio.','Definizione e gestione di policy di sicurezza di rete e firewalling a tutela dei dati sensibili trattati.','Applicazione di ACL per il controllo dell\\u2019accesso ai dati medici critici.','Pianificazione e gestione di attività di monitoring, backup e disaster recovery dei sistemi.','Attività di troubleshooting e manutenzione sistemistica ordinaria e straordinaria.','Gestione dei rapporti con fornitori esterni di materiale medico e di piattaforme sanitarie.'] }\n      ],\n      powsup: {\n        title: 'Direzione associativa e compliance',\n        kicker: 'Governance no profit',\n        role: 'Team Leader — Contabilità e Compliance',\n        org: 'PowsUp! APS · Amministratore',\n        lead: 'PowsUp! APS è un\\u2019associazione no profit regolarmente iscritta al RUNTS. Come amministratore dell\\u2019associazione guido il settore Contabilità e Compliance, che si occupa delle finanze e di tutti gli obblighi di legge che derivano da quell\\u2019iscrizione.',\n        lead2: 'Mi sono occupato di questa parte dalla costruzione dell\\u2019associazione fino a oggi: ho imparato per conto mio la legislazione dietro la gestione di un\\u2019APS e ho costruito la funzione da zero — fuori dal mio stretto ambito di competenze, e oggi una pratica di governance funzionante.',\n        facts: [\n          { label: 'Ruolo', value: 'Amministratore; Team Leader, Contabilità e Compliance' },\n          { label: 'Ambito', value: 'Contabilità, obblighi RUNTS, documentazione GDPR' },\n          { label: 'Iscrizione', value: 'RUNTS — Registro Unico Nazionale del Terzo Settore' },\n          { label: 'Come', value: 'Legislazione appresa in autonomia, dalla costituzione dell\\u2019associazione' }\n        ]\n      },\n      powsupBlocks: [\n        { kicker: 'Finanza', title: 'Contabilità', items: ['Bilancio d\\u2019esercizio e relazioni che un\\u2019APS è tenuta a produrre.','Contabilità corrente, tesoreria e gestione delle quote associative.','Pianificazione del budget e controllo delle spese sulle attività dell\\u2019associazione.','Predisposizione dei dati che il consiglio direttivo e l\\u2019assemblea dei soci approvano.'] },\n        { kicker: 'Legale', title: 'RUNTS e adempimenti', items: ['Iscrizione al RUNTS e depositi richiesti dal registro.','Monitoraggio e rispetto delle scadenze e degli obblighi di rendicontazione.','Tenuta dello statuto, dei libri sociali e del registro dei soci.','Interpretazione della normativa del terzo settore applicata alle attività dell\\u2019associazione.'] },\n        { kicker: 'Protezione dei dati', title: 'Programma GDPR', items: ['Registro dei trattamenti dei dati dell\\u2019associazione.','Privacy policy e informative per soci e partecipanti.','Valutazione d\\u2019impatto sulla protezione dei dati (DPIA).','Risk assessment — la parte di questo lavoro più vicina alla mia formazione in sicurezza.'] }\n      ],\n      education: { title: 'Formazione' },\n      educationItems: [\n        { period: '2024 — 2026', status: 'In corso — laurea prevista con lode', title: 'Laurea Magistrale in Ingegneria del Software', org: 'Sapienza Università di Roma',\n          note: 'Specializzazione in sicurezza e networking. Tesi sull\\u2019instradamento guidato dal machine learning implementato in P4 (vedi Ricerca).',\n          courses: [\n            { name: 'Practical Network Defense', grade: '30/30 e lode', desc: 'Esame che verte particolarmente nell\\u2019ambito pratico di attacco e difesa, di configurazione e di hardening di una rete aziendale, con sistemi di sicurezza quali IDS/IPS, pentesting, proxy e firewall. Contiene deep-dive delle conoscenze esplorate nell\\u2019esame di Cybersecurity.' },\n            { name: 'Cybersecurity', grade: '30/30', desc: 'Diviso in due moduli: il primo, un excursus su crittografia simmetrica ed asimmetrica, hashing crittografici, access control, web certificates e autenticazione, con una parte pratica su SSL-TLS e su protocolli di sicurezza come IPSec, SSH e iptables. Il secondo su mail security e web security, con i possibili attacchi e il modo per proteggersene.' },\n            { name: 'Secure Computation', grade: '30/30', desc: 'Esplorazione e applicazione degli ambiti multi-party e distributed computation, post-quantum security, garbled circuits e ZKP, con particolare attenzione alla composizione di protocolli a partire da blocchi crittografici già dimostrati sicuri (es. Oblivious Transfer, coin flipping). Cenni di homomorphic encryption. Utilizzo di MP-SPDZ come framework MPC.' },\n            { name: 'Programmable Networks', grade: '30/30', desc: 'Analisi dello stato dell\\u2019arte sullo stack ISO/OSI e sulla network infrastructure: automazione del management plane tramite NETCONF e YANG, del control plane tramite SDN, OpenFlow e Segment Routing, del data plane tramite switch software-defined e P4 come dominio di programmazione per ASIC specifici. Una delle basi principali del lavoro di tesi.' },\n            { name: 'Malware Analysis', grade: '29/30', desc: 'Software analysis applicata a packing, C2 server e reverse engineering nell\\u2019ambito di static e dynamic analysis, crypto e code injection, con un deep-dive nell\\u2019analisi di assembly, sperimentata su malware reali — tra cui l\\u2019analisi parziale del ransomware che nel febbraio 2026 ha attaccato i sistemi Sapienza.' }\n          ] },\n
